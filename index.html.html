<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TVM Calculator — Financial Services Assistant</title>
<style>
:root{
  --navy:#12263f; --navy-2:#1d3a5c; --bg:#f3f6fa; --card:#fff; --ink:#1e293b; --muted:#64748b;
  --accent:#0f766e; --accent-l:#5eead4; --line:#e2e8f0; --bad:#b91c1c; --hi:#e6f4f1; --r:8px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
@media(max-width:820px){.app{grid-template-columns:1fr}}
.sidebar{background:var(--navy);color:#e2e8f0;padding:28px 0 20px;display:flex;flex-direction:column}
.brand{padding:0 24px 22px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px}
.brand .mark{font-size:11px;color:var(--accent-l);margin:0 0 6px}
.brand h1{font-size:22px;margin:0;font-weight:600}
.brand p.sub{font-size:12px;color:#94a3b8;margin:8px 0 0}
nav{flex:1;padding:6px 12px}
nav button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:none;color:#cbd5e1;padding:11px 12px;font-size:14.5px;border-radius:6px;cursor:pointer;margin-bottom:2px;font-family:inherit;transition:.15s}
nav button .idx{font-size:12.5px;color:var(--accent-l);min-width:16px}
nav button:hover{background:rgba(255,255,255,.07);color:#fff}
nav button.active{background:var(--navy-2);color:#fff;box-shadow:inset 3px 0 0 var(--accent-l)}
nav .badge{margin-left:auto;background:var(--accent);color:#fff;border-radius:10px;font-size:11px;padding:1px 8px}
.sidebar-foot{padding:14px 24px 0;border-top:1px solid rgba(255,255,255,.12);font-size:11px;color:#8494a7}
main{padding:38px 44px 60px;max-width:1020px}
@media(max-width:820px){main{padding:28px 18px 50px}}
.panel{display:none}.panel.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.panel-head{border-bottom:2px solid var(--navy);padding-bottom:14px;margin-bottom:26px}
.kicker{font-size:12px;color:var(--accent);margin:0 0 4px;font-weight:600}
.panel-head h2{font-size:28px;margin:0 0 6px;color:var(--navy)}
.desc{font-size:14px;color:var(--muted);max-width:640px;margin:0}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:36px}
@media(max-width:720px){.grid-2{grid-template-columns:1fr}}
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--navy);margin-bottom:6px}
.field input,.field select{width:100%;padding:10px 12px;font-size:15px;border:1px solid #cbd5e1;background:var(--card);border-radius:6px;color:var(--ink);font-family:inherit}
.field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.err{display:none;font-size:12px;color:var(--bad);margin-top:5px}
.field.invalid input{border-color:var(--bad)}.field.invalid .err{display:block}
.actions{margin:18px 0 8px;display:flex;gap:12px;align-items:center}
.calc-btn{background:var(--accent);color:#fff;border:none;padding:12px 26px;font-size:14.5px;font-weight:600;border-radius:6px;cursor:pointer;font-family:inherit}
.calc-btn:hover{background:#0b5f58}
.ghost-btn{background:none;border:1px solid #cbd5e1;color:var(--muted);padding:11px 18px;border-radius:6px;cursor:pointer;font-size:13.5px;font-family:inherit}
.ghost-btn:hover{border-color:var(--navy);color:var(--navy)}
.ghost-btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.results{margin-top:0;padding:22px 24px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);display:none;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.results.show{display:block}
.r-row{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px dashed var(--line)}
.r-row:last-child{border-bottom:none}
.r-label{color:var(--muted);font-size:13.5px}
.r-value{font-size:19px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.r-value.primary{color:var(--accent);font-size:23px}
.table-wrap{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-top:20px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
thead th{background:var(--navy);color:#fff;font-weight:600;position:sticky;top:0}
tbody tr:nth-child(even){background:#f8fafc}
tr.best{background:var(--hi)!important}
table.hist td{text-align:left}table.hist td.res{text-align:right;font-weight:600;color:var(--accent)}
.hist-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.empty{padding:34px;text-align:center;color:var(--muted);font-size:14px}
.x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px}.x:hover{color:var(--bad)}
footer{max-width:1020px;padding:0 44px 40px;font-size:11.5px;color:var(--muted)}
@media(max-width:820px){footer{padding:0 18px 40px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <p class="mark">MIT Vishwaprayag University · School of Business</p>
      <h1>TVM Calculator</h1>
      <p class="sub">BS3210 — Financial Services Assistance Application</p>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">Assignment 1 · Milestone 1<br>Calculations run locally in your browser.</div>
  </aside>
  <main id="main"></main>
</div>
<footer>Assignment 1 · Milestone 1 — History is stored in this browser only.</footer>

<script>
const inr = v => new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(v);
const P = {id:'p',label:'Principal amount (₹)',ph:'e.g. 100000'};
const R = (label='Annual interest rate (%)',ph='e.g. 8') => ({id:'r',label,ph,zero:true});
const T = (label='Time period (years)',ph='e.g. 5') => ({id:'t',label,ph});
const emiOf = (p,r,y)=>{const m=r/1200,n=y*12;return m===0?p/n:p*m/(1-Math.pow(1+m,-n))};

const CALCS = [
 {id:'fv',title:'Future Value',btn:'Calculate future value',desc:'Projects what a sum invested today will grow to after a given period, at a fixed annual rate of return.',
  fields:[P,R('Annual interest rate (%)'),T()],
  run:v=>{const f=v.p*Math.pow(1+v.r/100,v.t);return {rows:[['Total growth',inr(f-v.p)],['Future value',inr(f),1]],main:inr(f)}}},
 {id:'pv',title:'Present Value',btn:'Calculate present value',desc:"Discounts a known future sum back to today's terms, using a chosen discount rate.",
  fields:[{id:'p',label:'Future value (₹)',ph:'e.g. 150000'},R('Discount rate (%)'),T()],
  run:v=>{const p=v.p/Math.pow(1+v.r/100,v.t);return {rows:[['Discount applied',inr(v.p-p)],['Present value',inr(p),1]],main:inr(p)}}},
 {id:'si',title:'Simple Interest',btn:'Calculate simple interest',desc:'Interest earned on the original principal only, for the full duration of the investment or loan.',
  fields:[{id:'p',label:'Principal (₹)',ph:'e.g. 50000'},R('Interest rate (% per year)','e.g. 6'),T('Time (years)','e.g. 3')],
  run:v=>{const i=v.p*v.r*v.t/100;return {rows:[['Interest earned',inr(i)],['Maturity value',inr(v.p+i),1]],main:inr(v.p+i)}}},
 {id:'ci',title:'Compound Interest',btn:'Calculate compound interest',desc:'Interest earned on both the principal and previously accumulated interest, compounded at a chosen frequency.',
  fields:[{id:'p',label:'Principal (₹)',ph:'e.g. 50000'},R(),T('Time (years)','e.g. 4')],
  selects:[{id:'n',label:'Compounding frequency',opts:[[1,'Annually (1/yr)'],[2,'Semi-annually (2/yr)'],[4,'Quarterly (4/yr)'],[12,'Monthly (12/yr)'],[365,'Daily (365/yr)']],def:4}],
  run:v=>{const m=v.p*Math.pow(1+v.r/100/v.n,v.n*v.t);return {rows:[['Compound interest',inr(m-v.p)],['Maturity value',inr(m),1]],main:inr(m)}}},
 {id:'emi',title:'EMI Calculator',btn:'Calculate EMI',desc:'Computes the fixed monthly instalment required to repay a loan over its tenure.',
  fields:[{id:'p',label:'Loan amount (₹)',ph:'e.g. 2000000'},R(undefined,'e.g. 8.5'),T('Loan tenure (years)','e.g. 20')],
  run:v=>{const e=emiOf(v.p,v.r,v.t),tot=e*v.t*12;return {rows:[['Monthly EMI',inr(e),1],['Total payment',inr(tot)],['Total interest payable',inr(tot-v.p)]],main:inr(e)+' / month'}}},
 {id:'amort',title:'Loan Amortization',btn:'Generate schedule',desc:'Generates the full month-by-month breakdown of a loan: opening balance, interest, principal repaid, EMI and closing balance.',
  fields:[{id:'p',label:'Loan amount (₹)',ph:'e.g. 500000'},R(undefined,'e.g. 9'),T('Tenure (years)','e.g. 3')],
  run:v=>{
    const e=emiOf(v.p,v.r,v.t),m=v.r/1200,n=Math.round(v.t*12);let b=v.p,ti=0,body='';
    for(let k=1;k<=n;k++){const i=b*m,pp=e-i,o=b;b=Math.max(0,b-pp);ti+=i;
      body+=`<tr><td>${k}</td><td>${inr(o)}</td><td>${inr(i)}</td><td>${inr(pp)}</td><td>${inr(e)}</td><td>${inr(b)}</td></tr>`}
    return {rows:[['Monthly EMI',inr(e),1],['Total interest payable',inr(ti)]],main:inr(e)+' / month',
      table:`<thead><tr><th>Month</th><th>Opening balance</th><th>Interest</th><th>Principal repaid</th><th>EMI</th><th>Closing balance</th></tr></thead><tbody>${body}</tbody>`}}},
 {id:'scenario',title:'Scenario Analysis',btn:'Compare scenarios',desc:'Compares the same amount and time period across four return scenarios to see which path produces the strongest outcome.',
  fields:[P,T()],
  run:v=>{
    const sc=[['Conservative',6],['Balanced',8],['Growth',10],['Optimistic',12]].map(([n,r])=>({n,r,f:v.p*Math.pow(1+r/100,v.t)}));
    const best=sc.reduce((a,c)=>c.f>a.f?c:a);
    return {rows:null,main:`Best: ${best.n} (${best.r}%) → ${inr(best.f)}`,
      table:`<thead><tr><th>Scenario</th><th>Rate</th><th>Future value</th><th>Growth</th></tr></thead><tbody>${sc.map(s=>`<tr class="${s===best?'best':''}"><td>${s.n}</td><td>${s.r}%</td><td>${inr(s.f)}</td><td>${inr(s.f-v.p)}</td></tr>`).join('')}</tbody>`}}}
];

/* ---------- History (localStorage with in-memory fallback) ---------- */
const KEY='tvm-history-v1'; let mem=[];
function loadH(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return mem}}
function saveH(h){mem=h;try{localStorage.setItem(KEY,JSON.stringify(h))}catch(e){}}
function addHistory(entry){const h=loadH();h.unshift({...entry,time:Date.now()});saveH(h.slice(0,200));renderHistory()}

/* ---------- Build UI ---------- */
const nav=document.getElementById('nav'), main=document.getElementById('main');
CALCS.forEach((c,i)=>{
  nav.insertAdjacentHTML('beforeend',`<button data-panel="${c.id}" class="${i?'':'active'}"><span class="idx">${i+1}</span> ${c.title}</button>`);
  const f=c.fields.map(x=>`<div class="field"><label for="${c.id}-${x.id}">${x.label}</label><input type="number" id="${c.id}-${x.id}" placeholder="${x.ph}" min="0" step="any"><div class="err"></div></div>`).join('');
  const s=(c.selects||[]).map(x=>`<div class="field"><label for="${c.id}-${x.id}">${x.label}</label><select id="${c.id}-${x.id}">${x.opts.map(o=>`<option value="${o[0]}" ${o[0]==x.def?'selected':''}>${o[1]}</option>`).join('')}</select></div>`).join('');
  main.insertAdjacentHTML('beforeend',`<section class="panel ${i?'':'active'}" id="panel-${c.id}">
    <div class="panel-head"><p class="kicker">Calculator ${i+1}</p><h2>${c.title}</h2><p class="desc">${c.desc}</p></div>
    <div class="grid-2"><div>${f}${s}<div class="actions"><button class="calc-btn" data-calc="${c.id}">${c.btn}</button><button class="ghost-btn" data-reset="${c.id}">Reset</button></div></div>
    <div><div class="results" id="${c.id}-res"></div></div></div>
    <div class="table-wrap" id="${c.id}-tbl" style="display:none"><table></table></div></section>`);
});
nav.insertAdjacentHTML('beforeend',`<button data-panel="history"><span class="idx">${CALCS.length+1}</span> History <span class="badge" id="hcount">0</span></button>`);
main.insertAdjacentHTML('beforeend',`<section class="panel" id="panel-history">
  <div class="panel-head"><p class="kicker">Record</p><h2>Calculation History</h2><p class="desc">Every calculation you run is saved here automatically, newest first, and kept in this browser between visits.</p></div>
  <div class="hist-tools"><select id="hfilter" class="ghost-btn"></select><button class="ghost-btn danger" id="hclear">Clear all history</button></div>
  <div class="table-wrap" id="hwrap"></div></section>`);

const hf=document.getElementById('hfilter');
hf.innerHTML='<option value="">All calculators</option>'+CALCS.map(c=>`<option>${c.title}</option>`).join('');
hf.onchange=renderHistory;
document.getElementById('hclear').onclick=()=>{if(confirm('Delete all saved calculations?')){saveH([]);renderHistory()}};

function showPanel(n){
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+n));
  nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.panel===n));
}
nav.onclick=e=>{const b=e.target.closest('button');if(b)showPanel(b.dataset.panel)};

function setErr(id,bad,msg){const f=document.getElementById(id).closest('.field');f.classList.toggle('invalid',bad);f.querySelector('.err').textContent=bad?msg:''}

function calculate(id){
  const c=CALCS.find(x=>x.id===id),v={};let ok=true;
  c.fields.forEach(f=>{
    const val=Number(document.getElementById(`${id}-${f.id}`).value), raw=document.getElementById(`${id}-${f.id}`).value;
    const bad=raw===''||!Number.isFinite(val)||(f.zero?val<0:val<=0);
    setErr(`${id}-${f.id}`,bad,f.zero?'Enter a rate of 0 or higher.':'Enter a value greater than 0.');
    if(bad)ok=false;v[f.id]=val;
  });
  if(!ok)return;
  (c.selects||[]).forEach(x=>{v[x.id]=Number(document.getElementById(`${id}-${x.id}`).value)});
  const out=c.run(v),res=document.getElementById(id+'-res');
  res.innerHTML=out.rows?out.rows.map(r=>`<div class="r-row"><span class="r-label">${r[0]}</span><span class="r-value ${r[2]?'primary':''}">${r[1]}</span></div>`).join(''):`<div class="r-row"><span class="r-label">Strongest outcome</span><span class="r-value primary" style="font-size:17px">${out.main}</span></div>`;
  res.classList.add('show');
  const tw=document.getElementById(id+'-tbl');
  if(out.table){tw.querySelector('table').innerHTML=out.table;tw.style.display='block'}
  const inputs=c.fields.map(f=>`${f.label.replace(/ \(.*\)/,'')}: ${f.id==='p'?inr(v[f.id]):v[f.id]}${f.id==='r'?'%':f.id==='t'?' yr':''}`).join(' · ')
    +(c.selects||[]).map(x=>` · ${x.label}: ${x.opts.find(o=>o[0]==v[x.id])[1]}`).join('');
  addHistory({calc:c.title,inputs,result:out.main});
}
function reset(id){
  const c=CALCS.find(x=>x.id===id);
  c.fields.forEach(f=>{document.getElementById(`${id}-${f.id}`).value='';setErr(`${id}-${f.id}`,false,'')});
  document.getElementById(id+'-res').classList.remove('show');
  document.getElementById(id+'-tbl').style.display='none';
}
main.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.calc)calculate(b.dataset.calc);
  if(b.dataset.reset)reset(b.dataset.reset);
  if(b.dataset.del){const h=loadH();h.splice(Number(b.dataset.del),1);saveH(h);renderHistory()}
});

function renderHistory(){
  const all=loadH(),flt=hf.value;
  document.getElementById('hcount').textContent=all.length;
  const rows=all.map((h,i)=>({h,i})).filter(x=>!flt||x.h.calc===flt);
  document.getElementById('hwrap').innerHTML=rows.length
    ?`<table class="hist"><thead><tr><th>Date & time</th><th>Calculator</th><th>Inputs</th><th style="text-align:right">Result</th><th></th></tr></thead><tbody>${rows.map(({h,i})=>`<tr><td>${new Date(h.time).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}</td><td>${h.calc}</td><td>${h.inputs}</td><td class="res">${h.result}</td><td><button class="x" title="Delete" data-del="${i}">✕</button></td></tr>`).join('')}</tbody></table>`
    :'<div class="empty">No calculations yet. Run any calculator and it will appear here.</div>';
}
renderHistory();
</script>
</body>
</html>
